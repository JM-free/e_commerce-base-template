name: CI

on:
  push:
    branches: [custom-culicula]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build Payload
        run: yarn build:payload

      - name: Build Server
        run: yarn build:server
