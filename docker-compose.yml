version: "3.8"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "NEXT_BUILD=true node dist/server.js && node dist/server.js"
    # Uncomment the following lines if you want to develop locally with live code
    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
